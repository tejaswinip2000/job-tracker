<form [formGroup]="form" (ngSubmit)="submit()" class="form">
  <div class="field">
    <input formControlName="company" placeholder="Company" />
    @if (form.controls.company.touched && form.controls.company.invalid) {
      <small class="error">Company is required (min 2 characters)</small>
    }
  </div>
  <div class="field">
    <input formControlName="role" placeholder="Role" />
    @if (form.controls.role.touched && form.controls.role.invalid) {
      <small class="error">Role is required (min 2 characters)</small>
    }
  </div>
  <button type="submit">Add job</button>
</form>
